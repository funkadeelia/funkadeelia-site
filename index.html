<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>funkadeelia.co.uk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .domain {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #111;
    }

    /* the logo standing in for each "a": same height as the letters' x-height */
    .a-logo {
      display: inline-block;
      width: 0.56em;
      height: 0.56em;
      margin: 0 0.02em;
      vertical-align: -0.012em;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #ddd;
      margin: 1.8rem auto;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
    }

    .footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.75rem;
      color: #ccc;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="domain" aria-label="funkadeelia"><span aria-hidden="true">funk<svg class="a-logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M0 50A50 50 0 0 1 50 0A50 50 0 0 1 100 50L100 100L50 100A50 50 0 0 1 0 50Z M25 57.5A32.5 32.5 0 0 1 57.5 25A32.5 32.5 0 0 1 90 57.5L90 90L57.5 90A32.5 32.5 0 0 1 25 57.5Z"/></svg>deeli<svg class="a-logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M0 50A50 50 0 0 1 50 0A50 50 0 0 1 100 50L100 100L50 100A50 50 0 0 1 0 50Z M25 57.5A32.5 32.5 0 0 1 57.5 25A32.5 32.5 0 0 1 90 57.5L90 90L57.5 90A32.5 32.5 0 0 1 25 57.5Z"/></svg></span></h1>
    <div class="divider"></div>
    <div class="tagline">Coming Soon.</div>
  </div>
  <div class="footer">something's brewing</div>
  <script src="logo-cursor.js" defer></script>
</body>
</html>
